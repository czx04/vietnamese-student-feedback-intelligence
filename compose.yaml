services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-feedback}
      POSTGRES_USER: ${POSTGRES_USER:-feedback}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: ${BACKEND_TARGET:-baseline}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-feedback}:${POSTGRES_PASSWORD:-change-this-password}@database:5432/${POSTGRES_DB:-feedback}
      MODEL_BACKEND: ${MODEL_BACKEND:-baseline}
      ARTIFACTS_DIR: /app/artifacts
      VNCORENLP_DIR: /app/artifacts/vncorenlp
      PHOBERT_BATCH_SIZE: ${PHOBERT_BATCH_SIZE:-32}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    volumes:
      - ./artifacts:/app/artifacts:ro
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
